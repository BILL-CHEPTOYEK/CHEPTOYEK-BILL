name: CI/CD for React App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      # `npm ci` rather than `npm install`, so the build uses the versions in
      # the lockfile instead of whatever resolves on the day it runs.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the app
        run: npm run build

      # Guarded: without this, opening a pull request publishes that branch to
      # gh-pages. The job still builds and tests on a PR, which is the point of
      # running it there - it just doesn't deploy.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
