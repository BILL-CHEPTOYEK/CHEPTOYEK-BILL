<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cheptoyek Bill</title>
    <meta name="description" content="Cheptoyek Bill - software engineer building software that uplifts humanity." />
    <meta name="author" content="Cheptoyek Bill" />
    <link rel="canonical" href="https://cheptoyek.com/" />

    <!-- Both faces are SIL Open Font License 1.1. Loaded as a stylesheet link
         rather than a CSS @import so the request starts with the HTML parse
         instead of waiting for the bundled stylesheet to arrive first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Link previews. Without these, every shared link renders as a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cheptoyek.com" />
    <meta property="og:title" content="Cheptoyek Bill" />
    <meta property="og:description" content="Software engineer building software that uplifts humanity." />
    <meta property="og:url" content="https://cheptoyek.com/" />
    <meta property="og:image" content="https://cheptoyek.com/dp.jpg" />
    <meta property="og:image:alt" content="Cheptoyek Bill" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cheptoyek Bill" />
    <meta name="twitter:description" content="Software engineer building software that uplifts humanity." />
    <meta name="twitter:image" content="https://cheptoyek.com/dp.jpg" />

    <!-- The other half of public/404.html: put the path the visitor actually
         asked for back in the address bar before the router reads it. Wrapped
         in a try for the same reason the 404 side is - a browser with storage
         locked down throws on the read, and an exception in this script would
         take the whole restore with it. Only a same-origin path is accepted;
         replaceState throws outright on a cross-origin URL. -->
    <script>
      (function () {
        try {
          const redirect = sessionStorage.redirect;
          sessionStorage.removeItem("redirect");

          if (redirect && redirect.startsWith("/") && !redirect.startsWith("//")) {
            history.replaceState(null, "", redirect);
          }
        } catch (error) {
          // No storage, or nothing stashed. The app still mounts at "/".
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
